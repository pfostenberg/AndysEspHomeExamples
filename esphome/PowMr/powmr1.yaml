text_sensor:
  - platform: modbus_controller
    modbus_controller_id: smg_inverter
    name: "${inverter_name} Charger Status"
    entity_category: diagnostic
    address: 4555
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = swapBytes(x);
      switch (value) {
        case 0: return std::string("Off");
        case 1: return std::string("Idle");
        case 2: return std::string("Active");
        default: return std::string("Unknown");
      }
    web_server:
      sorting_weight: 81
      sorting_group_id: sg_sonst


