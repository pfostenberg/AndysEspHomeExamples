# python -m esphome run powmr1.yaml
# https://github.com/GamesterUnknown/PowMR_ESPHome
# 192.168.77.152
substitutions:
  device_name: "powmr1"
  node_name: "PowMR1"
  inverter_name: "INV2"
  inverter_tx_pin: GPIO7
  inverter_rx_pin: GPIO6
  inverter_voltage_offset: "0"
  update_interval: 10s 
  select_skip_updates: "6"
  read_skip_updates: "6"


esphome: 
  name: "${device_name}"
  friendly_name: "${node_name}"
  comment: "Monitor and control a PowMR solar inverter via modbus"
  includes:
    - "helpers"
  project:
    name: "esphome.powmr-hybrid-inverter"
    version: 1.5.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  variant: esp32s3
  framework:
    type: esp-idf

ota:
- platform: esphome
  password: !secret ota_password
  

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "My-Inverter Fallback Hotspot"
    password: !secret ap_password

captive_portal:

packages:
  common_sensors: !include includes/common_sensors.yaml


logger:
  id: uart_logger
#  baud_rate: 0
  level: INFO
#  logs:
#    esp32_ble_tracker: INFO
#    esp32_ble_client: INFO
#    jk_bms_ble: INFO
#    sensor: INFO
#    text_sensor: INFO
#    binary_sensor: INFO
#    number: INFO
#    modbus_controller: DEBUG
#    uart: DEBUG
  # logs:
  #   component: ERROR # Fix for issue #4717 "Component xxxxxx took a long time for an operation"



#time:
#  - platform: homeassistant
#    id: hass_time

web_server:
  version: 3
  port: 80
  sorting_groups:
    - id: sg_main
      name: "Main settings"
      sorting_weight: 1
    - id: sg_sonst
      name: "sonstige"
      sorting_weight: 10 
   
uart:

  - id: uart_inverter
    baud_rate: 2400
    rx_pin: GPIO6
    tx_pin: GPIO7
    
    
    debug:
     direction: BOTH
     dummy_receiver: false
     after:
      delimiter: "\n"
     sequence:
      - lambda: UARTDebug::log_string(direction, bytes);
 
modbus:
  - id: modbus_inverter
    uart_id: uart_inverter
    send_wait_time: 500ms
  


modbus_controller:
  - id: smg_inverter
    address: 0x05
    modbus_id: modbus_inverter
    setup_priority: -10
    offline_skip_updates: 100
    #command_throttle: 1s
    update_interval: ${update_interval}
  


number:
  
  #Menu26 - 5027  Bulk charging voltage

  - platform: modbus_controller
    modbus_controller_id: smg_inverter
    name: "${inverter_name} Menu 26: Bulk Charging Voltage"
    address: 5027
    register_type: holding
    force_new_range: true
    skip_updates: ${select_skip_updates}
    value_type: U_WORD
    unit_of_measurement: "V"
    entity_category: config
    min_value: 48
    max_value: 61
    step: 0.1
    mode: box
    lambda: |-
      return x / 10.0;
    write_lambda: |-
      return (uint16_t)(x * 10);

    web_server:
      sorting_weight: 11
      sorting_group_id: sg_sonst
  #Menu27 - 5028 Floating charging voltage
  
  - platform: modbus_controller
    modbus_controller_id: smg_inverter
    name: "${inverter_name} Menu 27: Floating Charging Voltage"
    address: 5028
    register_type: holding
    force_new_range: true
    skip_updates: ${select_skip_updates}
    value_type: U_WORD
    unit_of_measurement: "V"
    entity_category: config
    min_value: 48
    max_value: 61
    step: 0.1
    mode: box
    lambda: |-
      return x / 10.0;
    write_lambda: |-
      return (uint16_t)(x * 10);
    web_server:
      sorting_weight: 11
      sorting_group_id: sg_sonst

  #Menu28 - 5029 Low DC cut-off voltage
  - platform: modbus_controller
    modbus_controller_id: smg_inverter
    name: "${inverter_name} Menu 28: Low DC Cut-off Voltage"
    address: 5029
    register_type: holding
    force_new_range: true
    skip_updates: ${select_skip_updates}
    value_type: U_WORD
    unit_of_measurement: "V"
    entity_category: config
    min_value: 40
    max_value: 49.9
    step: 0.1
    mode: box
    lambda: |-
      return x / 10.0;
    write_lambda: |-
      return (uint16_t)(x * 10);
    web_server:
      sorting_weight: 30
      sorting_group_id: sg_main

