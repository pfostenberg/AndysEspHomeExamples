    name: OCP
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t i = modbus_controller::word_from_hex_str(x, 0);      
      int bv = (i>>9)& 0x01;
      if (bv) {
        return std::string("enabled");                
      }
      return std::string("disabled");
    web_server:
      sorting_weight: 5
      sorting_group_id: sg_actions


  - platform: modbus_controller
    modbus_controller_id: powersupply    
    bitmask: 0x0100 
    register_type: holding
    address: 0    
    name: Output
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t i = modbus_controller::word_from_hex_str(x, 0);      
      int bv = (i>>8)& 0x01;
      if (bv) {
        return std::string("enabled");                
      }
      return std::string("disabled");
    web_server:
      sorting_weight: 6
      sorting_group_id: sg_actions

# Coil Addr. Description Attribute 
#0x0000 Power output read-write
#0x0001 OCP function read-write
#0x0002 Power panel keyboard lock read-write
#0x0003 Serial port data endianness setting read only
#0x0004 Constant pressure and constant current state read only
#0x0005 Alarm status read only
switch:
  - platform: modbus_controller
    modbus_controller_id: powersupply
    name: "PowerState"
    register_type: holding
    address: 0    
    entity_category: config
    icon: "mdi:toggle-switch"
    bitmask: 0x0100 
    write_lambda: |-
      ESP_LOGD("main","write lambda PSO = %d ",x);
      int data = 0x00;
      if (x>0) {        
        data = 0xFF;
      } 
      payload.push_back(0x1);  // device address
      payload.push_back(0x5);  // force single coil
      payload.push_back(0x00); // high byte address of the coil      
      payload.push_back(0x00);  // low byte address of the coil      
      payload.push_back(data); // ON = 0xFF00 OFF=0000      
      payload.push_back(0x00);            
      return x;  // dont care...

    command_topic: "wt1/Output/command"
    state_topic: "wt1/Output/state"
    command_retain: true

    web_server:
      sorting_weight: 0
      sorting_group_id: sg_main

  - platform: modbus_controller
    modbus_controller_id: powersupply
    name: "XSet28V10A"
    register_type: holding
    address: 4    
    entity_category: config
    icon: "mdi:toggle-switch"
    # fake 0
    lambda: |-
      return 0;
    
    # payload.push_back(0x03);  // Output und OCP an  
    write_lambda: |-
      ESP_LOGD("main","write lambda XXX = %d ",x); 
      uint16_t v = 2800; // 28V
      uint16_t a = 1000; // 10A
      payload.push_back(0x1);  // device address
      payload.push_back(0x10);  // force single coil
      payload.push_back(0x00); // high byte address of the coil      
      payload.push_back(0x00);  // low byte address of the coil 
      payload.push_back(0x00); // high byte address of the coil      
      payload.push_back(0x03);  // low byte address of the coil 
      payload.push_back(0x06); // high byte address of the coil      
      
      payload.push_back(0x01);  // Output und OCP aus           
      payload.push_back(0x00);  // fixed 0   
    
      payload.push_back(  (v & 0xFF)       );   // 100=1V       
      payload.push_back( ((v >> 8) & 0xFF) );   // 
      
      payload.push_back(  (a & 0xFF)       );   // 200 = 2A          
      payload.push_back( ((a >> 8) & 0xFF) );   //  
         

      return x;  // dont care...
      
      
    web_server:
      sorting_weight: 2
      sorting_group_id: sg_preset


