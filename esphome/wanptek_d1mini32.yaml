
# ESPHOME control for a 
# like https://www.wanptek.com/productinfo/1172723.html
# Model: KPS6050D 
# you should add RS485 to your order ( about 20.30 EUR) then you have a 3 pin connector you only need 2.
# but should work for other too.
# CPU: D1MINI ESP32 but should be easily changed to others.
# RS485: Waveshare TTL zu RS485 Konverter (C), galvanisch isoliert, Halbduplex, Überstromschutz, 3,3-5V
# https://www.berrybase.de/waveshare-ttl-zu-rs485-konverter-c-galvanisch-isoliert-halbduplex-ueberstromschutz-3-3-5v?gad_source=5&gad_campaignid=22696911352&gclid=EAIaIQobChMI0r7I-Je3lAMVGyqiAx0VzibPEAQYBCABEgK_OvD_BwE

# Advantage:
# you can control all setting.
# You do not see the temperature of the device.
# if you want to change the RS485 Address. 
# On the DC power supply panel, long press the "OUTPUT" button for 5 seconds. This will enter the system
# parameter setting mode. The system parameters that can be set include: 
# search for communication+protocol+4_1.pdf -> https://www.wanptek.com/xzzx

substitutions:
  device_name: "wt1"
  friendly_name: "wanptek 60V 50A KPS6050D RC1"                                           
  http_verify_ssl: "false"
  
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  
esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
    
# Enable/disable logging
logger:
  level: DEBUG # show IP address
#  level: INFO # VERY_VERBOSE, VERBOSE, DEBUG, INFO, WARN, ERROR, NONE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: high
#  power_save_mode: none
  
 
# OTA update
captive_portal:
 
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  birth_message:
    topic: wt1/msg
    payload: 'online'
  will_message:
    topic: wt1/msg
    payload: 'offline'


ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  verify_ssl: ${http_verify_ssl}
   
# lochraster 2026.05 mit ESP32    
uart:
  id: mod_bus
#  tx_pin: GPIO19
#  rx_pin: GPIO23
  tx_pin: GPIO5
  rx_pin: GPIO23

  baud_rate: 2400
  data_bits: 8
  stop_bits: 1
  parity: none

### comment out for release    xxxxxx
