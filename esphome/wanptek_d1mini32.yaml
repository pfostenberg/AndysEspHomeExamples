text_sensor:
  - platform: modbus_controller
    modbus_controller_id: powersupply    
    bitmask: 0x2000 
    register_type: holding
    address: 0    
    name: Alarm
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t i = modbus_controller::word_from_hex_str(x, 0);      
      int bv = (i>>13)& 0x01;
      if (bv) {
        return std::string("YES");                
      }
      return std::string("No");    
    web_server:
      sorting_weight: 1
      sorting_group_id: sg_actions

  - platform: modbus_controller
    modbus_controller_id: powersupply    
    bitmask: 0x1000 
    register_type: holding
    address: 0    
    name: Mode
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t i = modbus_controller::word_from_hex_str(x, 0);      
      int bv = (i>>12)& 0x01;
      if (bv) {
        return std::string("CC");                
      }
      return std::string("CV");    
    web_server:
      sorting_weight: 2
      sorting_group_id: sg_actions


# read only 
  - platform: modbus_controller
    modbus_controller_id: powersupply    
    bitmask: 0x0800 
    register_type: holding
    address: 0    
    name: Endian
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t i = modbus_controller::word_from_hex_str(x, 0);      
      int bv = (i>>11)& 0x01;
      if (bv) {
        return std::string("BIG");                
      }
      return std::string("Littel");
    web_server:
      sorting_weight: 3
      sorting_group_id: sg_actions


  - platform: modbus_controller
