# python -m esphome run LumiaxMC6015.yaml
# read out charge data from LumiaxMC6015

substitutions:
  device_name: "lumiax1"
  friendly_name: "lumiax1  21.02.2026"
  modbus_controller_id: mb1   
  device_type: lumiax1         
  multiplier_mischung: "0.1"
  http_verify_ssl: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_wroom_02
#  board: d1_mini

logger:
  level: DEBUG # show IP address
#  level: INFO # VERY_VERBOSE, VERBOSE, DEBUG, INFO, WARN, ERROR, NONE

wifi: 
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: high
  min_auth_mode: WPA2
  ap:
    ssid: ${device_name}
    password: ${ap_password}

# OTA update
captive_portal:
 
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password

ota:
  - platform: esphome
    password: !secret ota_password
  
button:
  - platform: restart
    name: "Neustart RS485/WIFI"
    web_server:
      sorting_weight: 100
      sorting_group_id: sg_intern

## END common
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
     - 0.de.pool.ntp.org
     - 1.de.pool.ntp.org
     - 2.de.pool.ntp.org
     
http_request:  
  timeout: 15s
  
# mutec cert not root id to validate!  
  verify_ssl: ${http_verify_ssl}
  

# GPIO12(D6) ( ALT TX-16) (ESP32 IO19)
# GPIO13(D7) ( ALT RX-15) (ESP32 IO23)
#tx_pin: 12
#  rx_pin: 13
uart:
  id: mod_bus
  tx_pin: GPIO12
  rx_pin: GPIO13
  baud_rate: 9600
  stop_bits: 1
### comment out for release  
#  debug:
#    direction: BOTH
#    dummy_receiver: false
#    after:
#      delimiter: "\n"
#    sequence:
#      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

 
modbus:
  id: modbus1
  send_wait_time: 1000ms
# flow_control_pin: 4 #for use when you use a rs485 board without auto flow control. Like the rs485 max board.
 
modbus_controller:
  - id: ${modbus_controller_id}
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 30sec
    command_throttle: 1ms
  
# \\192.168.43.200\work\work_svn\mp\IBAM\Technik\Charger\Lumiax\MC6015_Keller
  
sensor: 
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PVvoltage"
    id: pvvoltage
    # read is FC4
    register_type: read
      #       55 Solar voltage 304E (0d12366) 04(R) The voltage of the solar panel. V
    address: 12366   
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01      
    web_server:
      sorting_weight: 10
      sorting_group_id: sg_main  
  
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PowerAct"
    id: powerAct
    # read is FC4
    register_type: read
    # Electricity generation power-L 3050 (0d12368) 04(R) PV cell array current generated power W
    address: 12368    
    value_type: U_WORD
    unit_of_measurement: "W"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
      
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PowerDay"
    id: power_day
    # read is FC4
    register_type: read
      # The charging capacity of the day 3052 (0d12370) 04(R) Everyday 00：00 reset。 KWH 100
    address: 12370   
    value_type: U_WORD
    unit_of_measurement: "W"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
      
    web_server:
      sorting_weight: 12
      sorting_group_id: sg_main
      
      
web_server:
  version: 3
  port: 80
  sorting_groups:
    - id: sg_main
      name: "Main settings"
      sorting_weight: 1
    
    - id: sg_intern
      name: "Intern"
      sorting_weight: 90
    
 