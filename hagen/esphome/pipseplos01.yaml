# python -m esphome run pip5048_seplos.yaml
# 
#https://github.com/syssi/esphome-pipsolar
# https://github.com/syssi/esphome-pipsolar
# 1 TX MAX(RIN1)        -> PYLON 3
# 2 RX MAX(DOUT1)       -> PYLON 6 
# 4 12V   ( or 7)
# 8 GND     -           8 
# pipsep1 switch_on

# https://github.com/syssi/esphome-pipsolar/blob/main/esp32-example.yaml
# https://github.com/syssi/esphome-pipsolar/discussions/45
# https://github.com/syssi/esphome-pipsolar/tree/pip8048/components/pipsolar
# https://github.com/syssi/esphome-pipsolar/blob/pip8048/components/pipsolar/pipsolar.h pv1_input_current

# achtung garage Klosterallee 
# 2 unterschiedliche Seplos
# 1 mit 9600  der untere( hier im file)
# 2 mit 19200 der obere ( einges) 
# Grafana:
# INV_G1.ac_out_v    *
## INV_G1.ac_out_va  *
# INV_G1.ac_out_w
# INV_G1.batt_chrg_a * 
# INV_G1.batt_v      *
# INV_G1.ac_temp
# INV_G1.ac_load_p
# INV_G1.pv1v        *
## INV_G1.pv1a
# INV_G1.pv1w        *
# INV_G1.pvw

substitutions:
  name: pipseplos01
  device_description: "3 Seplos und PowMr 8KW"
  seplos_component_ref: "main"
  # pip8048-Branch: zwei getrennte PV-Eingaenge (QPIGS2)
  pipsolar_component_ref: "pip8048"
  http_verify_ssl: "false"
 

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "syssi.esphome-seplos-bms"
    version: 1.3.0

# Enable logging
logger:
  #level: DEBUG # show IP address
  level: INFO # VERY_VERBOSE, VERBOSE, DEBUG, INFO, WARN, ERROR, NONE

wifi: 
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: high
  ap:
    ssid: ${name}
    password: ${ap_password}

interval:  
  - interval: 1sec
    then:
#      - lambda: ESP_LOGD("autodown","m1_%d",id(pip_state).state);
#      - lambda: ESP_LOGD("autodown","m2_%d",id(pip_state).has_state() );
      - if:
          condition:
            lambda: |-
              return id(pip_state).has_state();
          then:          
#            - lambda: ESP_LOGD("autodown","switch_on = 1");
            - light.turn_on: pip_led
          else:
#            - lambda: ESP_LOGD("autodown","switch_on = 0");
            - light.turn_off: pip_led

# OTA update
captive_portal:
 
mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
#  state_topic: <TOPIC_PREFIX>/<COMPONENT_TYPE>/<COMPONENT_NAME>

ota:
  - platform: esphome
    password: !secret ota_password
  
button:
  - platform: restart
    name: "Restart Device"
    web_server:
      sorting_weight: 99
      sorting_group_id: sg_intern
    

http_request:
  verify_ssl: ${http_verify_ssl}
  

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  variant: esp32s3
  framework:
    type: esp-idf

uart:
  - id: uart_bms
    #baud_rate: 9600
    baud_rate: 19200    
    tx_pin: GPIO12
    rx_pin: GPIO13
    # The increased RX buffer size is important because
    # the full BMS response must fit into the buffer
    rx_buffer_size: 384
    
  - id: uart_pip1    
    baud_rate: 2400
    # NO 2 up.  
    rx_pin: GPIO6
    tx_pin: GPIO7    
#no1
#  tx_pin: 12
#  rx_pin: 13
#  debug:
#    direction: BOTH
#    dummy_receiver: false
#    after:
#      delimiter: "\r"
#    sequence:
#      - lambda: UARTDebug::log_string(direction, bytes);
   
pip8048: 
  - uart_id: uart_pip1
    id: inverter1
    update_interval: 60s
# 
#SELPOS START
external_components:
  - source: github://syssi/esphome-seplos-bms@main
    refresh: 3660s
  - source: github://syssi/esphome-pipsolar@main
    refresh: 3660s


seplos_modbus:
  id: modbus_bms
  uart_id: uart_bms
  
seplos_bms:
  - id: battery_bank0
    # Dip switch configuration of the first pack / address 0x01
    #  8    7    6    5    4    3    2   1
    # off, off, off, off, off, off, off, on
    address: 0x00
    # Known protocol versions: 0x20 (Seplos), 0x26 (Boqiang)
    protocol_version: 0x20
    seplos_modbus_id: modbus_bms
    update_interval: 120s
  - id: battery_bank1
    address: 0x01
    protocol_version: 0x20
    seplos_modbus_id: modbus_bms
    update_interval: 120s
  - id: battery_bank2
    address: 0x02
    protocol_version: 0x20
    seplos_modbus_id: modbus_bms
    update_interval: 120s
#SEPLOS END  

# Komponente liefert Volt; ioBroker erwartet weiterhin Millivolt
.v_to_mv: &v_to_mv
  - multiply: 1000

